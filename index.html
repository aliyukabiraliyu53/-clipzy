<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clipzy - TikTok Clone</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-black text-white">
<div class="h-screen flex flex-col max-w-[500px] mx-auto">
<header class="p-4 flex justify-between items-center border-b border-zinc-800">
<h1 class="font-bold text-xl">Clipzy 🔥</h1>
<label class="bg-white text-black px-4 py-2 rounded-full font-bold cursor-pointer">+ Upload<input id="fileInput" type="file" accept="video/*" hidden></label>
</header>
<div id="feed" class="flex-1 overflow-y-scroll snap-y snap-mandatory bg-black"><div class="h-full flex items-center justify-center text-zinc-500">Loading...</div></div>
</div>
<script>
const SUPABASE_URL='https://gukuzlvwqaripnufvmlt.supabase.co';
const SUPABASE_KEY='sb_publishable_x2ndSpPkpMsb3ajyBYBVrw_2y8K-84l';
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
async function loadVideos(){
const {data,error}=await supabaseClient.from('videos').select('*').order('created_at',{ascending:false});
const feed=document.getElementById('feed');
if(error){feed.innerHTML='Error: '+error.message;return;}
if(!data||data.length==0){feed.innerHTML='<div class="h-full flex items-center justify-center">No videos yet - Be first to upload!</div>';return;}
feed.innerHTML='';
data.forEach(v=>{
const div=document.createElement('div');
div.className='h-[calc(100vh-64px)] w-full snap-start relative flex items-center justify-center bg-black';
div.innerHTML=`<video src="${v.url}" class="h-full w-full object-contain" loop playsinline onclick="this.paused?this.play():this.pause()"></video><div class="absolute bottom-10 left-4"><p class="font-bold">@${v.user_id||'user'}</p><p class="text-sm">${v.cap||''}</p></div><div class="absolute bottom-10 right-4"><button onclick="likeVideo('${v.id}',${v.likes||0})" class="text-3xl">❤️<div class="text-sm">${v.likes||0}</div></button></div>`;
feed.appendChild(div);
});
}
async function likeVideo(id,likes){await supabaseClient.from('videos').update({likes:likes+1}).eq('id',id);loadVideos();}
document.getElementById('fileInput').addEventListener('change',async(e)=>{
const file=e.target.files[0];if(!file)return;
const cap=prompt('Caption:')||'';
const fileName=Date.now()+'-'+file.name.replace(/[^a-zA-Z0-9.]/g,'');
const label=document.querySelector('label');label.textContent='Uploading...';
const {error:upError}=await supabaseClient.storage.from('videos').upload(fileName,file);
if(upError){alert(upError.message);label.textContent='+ Upload';return;}
const {data:urlData}=supabaseClient.storage.from('videos').getPublicUrl(fileName);
await supabaseClient.from('videos').insert({id:fileName,url:urlData.publicUrl,cap:cap,user_id:'aliyu',likes:0});
alert('Uploaded! 🔥');label.textContent='+ Upload';loadVideos();
});
loadVideos();
</script>
</body>
</html>
